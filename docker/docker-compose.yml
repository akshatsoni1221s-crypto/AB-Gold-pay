version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: goldpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: goldpay_user
      POSTGRES_PASSWORD: goldpay_password
      POSTGRES_DB: goldpay_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldpay_user -d goldpay_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: goldpay-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass goldpay_redis_pass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: goldpay-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://goldpay_user:goldpay_password@postgres:5432/goldpay_erp?schema=public
      REDIS_URL: redis://:goldpay_redis_pass@redis:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_backups:/app/backups

volumes:
  postgres_data:
  redis_data:
  app_backups:
